<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Gaming - Noticias</title>
    <link rel="stylesheet" href="/assets/index-DvL186bl.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-hover: #1a1a24;
            --text-primary: #e0e0e8;
            --text-secondary: #8888a0;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --danger: #ff5f57;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-tor; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        h1, h2, h3, h4, h5, h6 { font-family: 'Orbitron', sans-serif; }
        
        a { text-decoration: none; color: inherit; transition: color 0.3s ease; }
        ul { list-style: none; }
        img { max-width: 100%; height: auto; }
        
        nav {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-dark));
            border-bottom: 1px solid var(--accent);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent), #00ccaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            position: relative;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: var(--accent);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after { width: 100%; }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }
        
        .back-btn:hover { color: var(--accent); }
        
        .section {
            padding: 8rem 2rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--accent), #00ccaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .noticias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .noticia-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-hover);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .noticia-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 255, 204, 0.15);
        }
        
        .noticia-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .noticia-card .content {
            padding: 1rem;
        }
        
        .noticia-card h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .noticia-card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .noticia-card .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        
        .tag {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        
        .noticia-expandida {
            background: var(--bg-hover);
            border-radius: 8px;
            padding: 2rem;
            margin-top: 2rem;
            max-height: 500px;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }
        
        .noticia-expandida.abierto {
            max-height: 1000px;
        }
        
        .noticia-resumida {
            max-height: 180px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .noticia-resumida.collapse {
            max-height: 0;
            padding-top: 0;
        }
        
        .fuente-badge {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }
        
        .noticia-card.expandida {
            box-shadow: 0 12px 32px rgba(0, 255, 204, 0.25);
        }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .section-title { font-size: 2rem; }
            .noticia-expandida { margin-top: 1rem; padding: 1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo" onclick="window.location='/'"
     style="cursor: pointer; display: inline-block; align-items: center;">
    <img src="/informegaming_logo.svg" 
         alt="Informe Gaming" 
         style="vertical-align: middle; width: 32px; height: 32px;">
    <span>Informe Gaming</span>
</div>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/hoy">Hoy</a></li>
                <li><a href="/semana">Esta Semana</a></li>
                <li><a href="/siempre">Siempre Gratis</a></li>
                <li><a href="/gta6">GTA 6</a></li>
                <li><a href="/noticias">Noticias</a></li>
            </ul>
        </div>
    </nav>
    
    <a href="/" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6-6 6"/>
        </svg>
        Volver al inicio
    </a>
    
    <main>
        <section class="section" id="noticias">
            <h1 class="section-title">Noticias <span>Gaming</span></h1>
            
            <div class="noticias-grid" id="noticias-grid">
                <!-- Cards populated by JS -->
            </div>
        </section>
    </main>
    
    <footer>
        <div class="footer-text">
            Informe Gaming - últimas noticias gaming
        </div>
    </footer>
    
    <script type="module" src="/src/js/router.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/noticias')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('noticias-grid');
                    if (!grid) return;
                    
                    if (!data || data.length === 0) {
                        grid.innerHTML = '<p class="text-center" style="color: var(--text-secondary);">No hay noticias disponibles</p>';
                        return;
                    }
                    
                    grid.innerHTML = data.map(noticia => `
                        <article class="noticia-card" data-noticia-id="${noticia.id || Math.random().toString(36).slice(2)}">
                            <img src="${noticia.image || '/placeholder.jpg'}" alt="${noticia.title}">
                            <div class="content">
                                <h3>${noticia.title}</h3>
                                <p>${noticia.excerpt || 'Resumen de la noticia'}</p>
                                <div class="tags">
                                    <span class="tag">${noticia.category || 'Noticias'}</span>
                                </div>
                            </div>
                        </article>
                    `).join('');
                    
                    // Agregar event listeners para expansión
                    document.querySelectorAll('.noticia-card').forEach(card => {
                        card.addEventListener('click', (e) => {
                            // No expandir si se hizo click en el enlace de "volver"
                            if (e.target.closest('.back-btn')) return;
                            
                            const card = card;
                            const content = card.querySelector('.content');
                            const isExpanded = card.classList.contains('expandida');
                            
                            // Toggle expandir/contraer
                            if (isExpanded) {
                                card.classList.remove('expandida');
                                content.classList.remove('noticia-expandida');
                                content.classList.add('noticia-resumida');
                            } else {
                                card.classList.add('expandida');
                                // Crear contenido expandido
                                const noticia = data.find(n => n.title === card.querySelector('h3').textContent);
                                if (noticia) {
                                    content.innerHTML = `
                                        <div class="noticia-expandida">
                                            <h2>${noticia.title}</h2>
                                            <p><strong>Fuente:</strong> ${noticia.source || 'Informe Gaming'}</p>
                                            <p><strong>Fecha:</strong> ${noticia.date || 'Fecha no disponible'}</p>
                                            <p>${noticia.content || noticia.excerpt || 'Contenido no disponible'}</p>
                                            <span class="fuente-badge">${noticia.category || 'Noticias'}</span>
                                        </div>
                                    `;
                                    content.classList.add('noticia-expandida');
                                    content.classList.remove('noticia-resumida');
                                }
                            }
                        });
                    });
                })
                .catch(err => {
                    console.error('Error loading noticias:', err);
                    const grid = document.getElementById('noticias-grid');
                    if (grid) grid.innerHTML = '<p style="color: var(--text-secondary);">Error cargando noticias</p>';
                });
        });
    </script>
</body>
</html>
